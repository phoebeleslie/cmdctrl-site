<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d0d0d" />
  <meta name="description" content="CMDCTRL — ideas, culture, original work." />
  <title>CMDCTRL</title>
  <style>
    :root{
      --paper:#ece8df;
      --line:rgba(236,232,223,.16);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:
        radial-gradient(circle at 18% 18%, rgba(255,255,255,.055), transparent 28%),
        radial-gradient(circle at 82% 74%, rgba(255,255,255,.035), transparent 32%),
        #0d0d0d;
      color:var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow:hidden;
    }
    .grain{
      position:fixed; inset:-50%; pointer-events:none; opacity:.055;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
      animation:grain 8s steps(10) infinite;
    }
    @keyframes grain{
      0%,100%{transform:translate(0,0)}
      20%{transform:translate(-3%,2%)}
      40%{transform:translate(2%,-2%)}
      60%{transform:translate(3%,3%)}
      80%{transform:translate(-2%,-3%)}
    }
    .orb{
      position:fixed;
      width:48vw; height:48vw;
      min-width:520px; min-height:520px;
      border-radius:50%;
      left:50%; top:50%;
      transform:translate(-50%,-50%);
      background:radial-gradient(circle at 35% 35%, rgba(255,255,255,.07), rgba(255,255,255,.015) 38%, transparent 68%);
      filter:blur(2px);
      animation:float 11s ease-in-out infinite;
      pointer-events:none;
    }
    @keyframes float{
      0%,100%{transform:translate(-50%,-50%) scale(1)}
      50%{transform:translate(-50%,-52%) scale(1.025)}
    }
    .shell{
      min-height:100%;
      display:grid;
      grid-template-rows:auto 1fr auto;
      padding:28px 34px 22px;
      position:relative;
      z-index:2;
    }
    .topbar,.footer{
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-size:11px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:rgba(236,232,223,.5);
    }
    .dot{
      width:7px; height:7px; border-radius:50%;
      background:var(--paper);
      box-shadow:0 0 16px rgba(236,232,223,.35);
      display:inline-block; margin-right:9px; vertical-align:1px;
    }
    main{display:grid;place-items:center;text-align:center}
    .hero{width:min(780px,92vw);transform:translateY(-1.5vh)}
    .mark{
      width:min(180px,34vw);
      aspect-ratio:1;
      margin:0 auto 28px;
      border-radius:28px;
      overflow:hidden;
      box-shadow:0 20px 80px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.08);
      background:var(--paper);
    }
    .mark img{width:100%;height:100%;object-fit:cover;transform:scale(1.35)}
    h1{
      margin:0;
      font-size:clamp(38px,7vw,78px);
      font-weight:500;
      letter-spacing:.26em;
      text-indent:.26em;
      line-height:1;
    }
    .kicker{
      margin:21px 0 0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(15px,2vw,21px);
      font-style:italic;
      color:rgba(236,232,223,.72);
      letter-spacing:.06em;
    }
    .status{
      margin:44px 0 0;
      font-size:12px;
      letter-spacing:.2em;
      text-transform:uppercase;
      color:rgba(236,232,223,.44);
    }
    .cta{
      display:inline-flex;
      align-items:center;
      gap:12px;
      margin-top:28px;
      color:var(--paper);
      text-decoration:none;
      text-transform:uppercase;
      letter-spacing:.2em;
      font-size:12px;
      padding:14px 0;
      border-bottom:1px solid rgba(236,232,223,.34);
      transition:.25s ease;
    }
    .cta:hover{gap:19px;border-color:var(--paper)}
    .cta .arrow{transition:transform .25s ease}
    .cta:hover .arrow{transform:translateX(3px)}
    .hairline{
      position:fixed; inset:50% auto auto 0;
      width:100%; height:1px;
      background:linear-gradient(90deg,transparent,var(--line),transparent);
      pointer-events:none;
    }
    @media (max-width:640px){
      .shell{padding:22px 20px 18px}
      .topbar .right{display:none}
      .mark{border-radius:22px}
      .status{margin-top:34px}
    }
    @media (prefers-reduced-motion:reduce){
      .grain,.orb{animation:none}
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="orb"></div>
  <div class="hairline"></div>

  <div class="shell">
    <header class="topbar">
      <div><span class="dot"></span>CMDCTRL.CO</div>
      <div class="right">Independent Creative Media</div>
    </header>

    <main>
      <section class="hero">
        <div class="mark">
          <img src="cmdctrl-logo.png" alt="CMDCTRL abstract mark" />
        </div>

        <h1>CMDCTRL</h1>
        <p class="kicker">Ideas. Culture. Original Work.</p>
        <p class="status">Something is taking shape.</p>

        <a class="cta" href="https://www.youtube.com/" target="_blank" rel="noopener">
          Enter <span class="arrow">→</span>
        </a>
      </section>
    </main>

    <footer class="footer">
      <div>© 2026 CMDCTRL</div>
      <div>New York</div>
    </footer>
  </div>
</body>
</html>
